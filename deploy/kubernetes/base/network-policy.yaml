apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eimza-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eimza-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
