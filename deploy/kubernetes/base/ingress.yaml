apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eimza-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 35m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - eimza.example.invalid
      secretName: eimza-api-tls
  rules:
    - host: eimza.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eimza-api
                port:
                  name: http
