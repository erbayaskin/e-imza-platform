apiVersion: v1
kind: Secret
metadata:
  name: eimza-api-secrets
  namespace: eimza
type: Opaque
stringData:
  EIMZA_DB_URL: jdbc:postgresql://postgres-ha.example.invalid:5432/eimza
  EIMZA_DB_USERNAME: REPLACE_FROM_SECRET_MANAGER
  EIMZA_DB_PASSWORD: REPLACE_FROM_SECRET_MANAGER
  EIMZA_OIDC_ISSUER_URI: https://identity.example.invalid/realms/eimza
  EIMZA_TSA_ENDPOINT: https://tsa.example.invalid
  EIMZA_TSA_AUTHORIZATION_HEADER: REPLACE_FROM_SECRET_MANAGER
