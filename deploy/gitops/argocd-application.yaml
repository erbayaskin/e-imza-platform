apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eimza-api-prod
  namespace: argocd
spec:
  project: eimza-prod
  source:
    repoURL: https://git.example.invalid/platform/eimza-deployment.git
    targetRevision: main
    path: deploy/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: eimza
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - FailOnSharedResource=true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
