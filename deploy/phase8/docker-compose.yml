services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${EIMZA_DB_NAME}
      POSTGRES_USER: ${EIMZA_DB_USERNAME}
      POSTGRES_PASSWORD: ${EIMZA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EIMZA_DB_USERNAME} -d ${EIMZA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  api1: &api
    build:
      context: ../..
      dockerfile: Dockerfile
    environment: &api-environment
      SPRING_PROFILES_ACTIVE: prod
      EIMZA_DB_URL: jdbc:postgresql://postgres:5432/${EIMZA_DB_NAME}
      EIMZA_DB_USERNAME: ${EIMZA_DB_USERNAME}
      EIMZA_DB_PASSWORD: ${EIMZA_DB_PASSWORD}
      EIMZA_OIDC_ISSUER_URI: ${EIMZA_OIDC_ISSUER_URI}
      EIMZA_OIDC_AUDIENCE: ${EIMZA_OIDC_AUDIENCE:-eimza-api}
      EIMZA_OIDC_JWS_ALGORITHMS: ${EIMZA_OIDC_JWS_ALGORITHMS:-RS256}
      EIMZA_TENANT_CLAIM: ${EIMZA_TENANT_CLAIM:-tenant_id}
      EIMZA_VALIDATION_POLICY_VERSION: ${EIMZA_VALIDATION_POLICY_VERSION}
      EIMZA_TSA_ENABLED: ${EIMZA_TSA_ENABLED:-false}
      EIMZA_TSA_ENDPOINT: ${EIMZA_TSA_ENDPOINT:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Djava.io.tmpdir=/tmp
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2500m
    cpus: 1.5
    networks: [backend, egress]

  api2:
    <<: *api
    environment:
      <<: *api-environment

  gateway:
    image: nginx:1.29-alpine
    depends_on: [api1, api2]
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    networks: [backend]

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
