events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 35m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/s;

    upstream eimza_api {
        least_conn;
        server api1:8080 max_fails=3 fail_timeout=10s;
        server api2:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ^~ /actuator/ {
            return 404;
        }

        location / {
            limit_req zone=api_per_ip burst=200 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://eimza_api;
        }
    }
}
